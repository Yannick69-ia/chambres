:root{
  --bg:#EFE5D7; --card:#FFFDF9; --ink:#1B2A4A; --muted:#7A6E65; --faint:#A2988C;
  --line:#E3D7C5; --accent:#E85946; --accent-light:#F0796A; --accent-soft:#F7DDD6;
  --serif:'JazminAlt',Georgia,serif; --sans:'CabinetGrotesk',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(27,42,74,.05),0 10px 26px rgba(27,42,74,.07);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;}
.wrap{max-width:560px;margin:0 auto;padding:0 20px;padding-block:40px 64px;}

.mast{text-align:center;margin-bottom:26px}
.wordmark{width:min(300px,80%);margin:0 auto 2px;display:block}
.wordmark svg{width:100%;height:auto;display:block}
.subtitle{margin-top:12px;font-size:16px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700}
.lead{text-align:center;color:var(--muted);font-size:15.5px;max-width:40ch;margin:0 auto 26px;text-wrap:balance}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 22px;box-shadow:var(--shadow)}
.form{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:7px}
.field .flabel,.field label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.field select{width:100%;font:inherit;font-size:16px;padding:13px 38px 13px 14px;border:1px solid var(--line);
  border-radius:11px;background:var(--bg);color:var(--ink);appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16'><path fill='%237A6E65' d='M4 6l4 4 4-4'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center}
.field select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;cursor:pointer;width:100%;
  font:inherit;font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;
  padding:14px 18px;border-radius:11px;border:1px solid var(--accent);background:var(--accent);
  color:var(--card);box-shadow:var(--shadow);transition:background .2s,transform .2s}
.btn:hover{background:var(--accent-light);border-color:var(--accent-light);transform:translateY(-1px)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line);text-transform:none;letter-spacing:.02em;font-size:13px;box-shadow:none}
.btn.ghost:hover{background:var(--accent);color:var(--card)}
.btn.small{width:auto;padding:10px 16px}
.picker{display:flex;flex-direction:column;gap:9px}
.picker p{margin:0 0 2px;text-align:center;font-size:13px;color:var(--muted)}
.pick{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;width:100%;
  background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px 15px;font:inherit;text-align:left;color:var(--ink)}
.pick:hover,.pick:focus-visible{border-color:var(--accent);outline:none}
.pick .pn{font-family:var(--serif);font-weight:900;font-size:18px}
.pick .pn .sur{font-size:.82em;color:var(--muted)}
.pick .arrow{color:var(--accent);font-weight:700}
.field input{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink)}
.field input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.msg{text-align:center;font-size:14px;color:var(--accent);font-weight:600;min-height:1.2em;margin:0}

.res{text-align:center}
.res .who{font-family:var(--serif);font-size:32px;font-weight:900;line-height:1.06;margin-bottom:6px;text-wrap:balance}
.res .who .sur{font-size:.76em;color:var(--muted)}
.welcome{color:var(--muted);font-size:14.5px;line-height:1.55;max-width:34ch;margin:8px auto 22px}

.plate{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 18px;border-radius:14px;
  background:var(--bg);border:1px solid var(--line);margin-bottom:14px}
.plate .k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:700}
.plate .v{font-family:var(--serif);font-size:34px;font-weight:900;line-height:1.1;color:var(--accent);text-wrap:balance}
.plate .desc{font-size:13.5px;color:var(--muted);line-height:1.5;max-width:40ch}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:4px}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink);background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:4px 12px}

.mates{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;width:100%}
.mates li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:10px 14px;text-align:left}
.mates .pn{font-family:var(--serif);font-weight:900;font-size:18px}
.mates .pn .sur{font-size:.82em;color:var(--muted)}
.mates .nn{font-size:12px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.alone{font-size:14px;color:var(--muted)}

.planbox{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in;width:100%;display:block;padding:0;background:var(--bg)}
.planbox img{display:block;width:100%;height:auto}
.pin{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  border:3px solid #fff;background:rgba(232,89,70,.35);box-shadow:0 0 0 3px var(--accent),0 2px 10px rgba(0,0,0,.35);pointer-events:none}
.pin::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--accent);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.pin::after{animation:none}}
.hint{font-size:12px;color:var(--faint);margin-top:2px;text-align:center}

.zoom{position:fixed;inset:0;z-index:50;background:rgba(27,42,74,.92);overflow:auto;-webkit-overflow-scrolling:touch}
.zoom .inner{position:relative;width:max(1400px,100vw)}
.zoom .inner img{display:block;width:100%;height:auto}
.zoom .close{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:51;width:auto;box-shadow:var(--shadow)}

.again{margin-top:22px}
.foot{text-align:center;margin-top:40px;color:var(--faint);font-size:12px}
.footlogo{display:flex;justify-content:center;margin-top:26px;color:var(--accent)}
.footlogo svg{width:46px;height:46px;display:block}
.confetti-piece{position:fixed;top:0;border-radius:2px;pointer-events:none;z-index:9999;opacity:0}
@media (max-width:420px){ .plate .v{font-size:30px} .res .who{font-size:28px} }
</style>

function nameHtml(p){ return esc(p.p+' '+p.n); }
function nuits(x){ return x+' nuit'+(x>1?'s':''); }

function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'')
  .toLowerCase().replace(/[-'’.]/g,' ').replace(/\s+/g,' ').trim();}
function search(q){
  var nq=norm(q); if(!nq) return [];
  var words=nq.split(' ');
  return PEOPLE.map(function(p,i){return i;}).filter(function(i){
    var toks=norm(PEOPLE[i].p+' '+PEOPLE[i].n).split(' ');
    return words.every(function(w){ return toks.some(function(t){return t.indexOf(w)===0;}); });
  }).sort(function(a,b){
    var A=PEOPLE[a],B=PEOPLE[b];
    return (A.p+' '+A.n).localeCompare(B.p+' '+B.n,'fr',{sensitivity:'base'});
  });
}
function showForm(pre){
  var app=document.getElementById('app');
  app.innerHTML=
     '<p class="lead">Tapez votre prénom pour découvrir votre chambre, avec qui vous la partagez et où elle se trouve sur le domaine.</p>'
    +'<div class="card"><form class="form" id="lookup" novalidate>'
    +'  <div class="field"><span class="flabel">Plan du domaine</span>'
    +'    <button class="planbox" type="button" id="planBtn0" aria-label="Agrandir le plan"><img src="'+PLAN+'" alt="Plan du domaine"></button>'
    +'    <div class="hint">Touchez le plan pour l’agrandir.</div></div>'
    +'  <div class="field"><label for="fName">Votre prénom</label>'
    +'    <input id="fName" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Ex. Camille" value="'+esc(pre||'')+'"></div>'
    +'  <div class="picker" id="picker" hidden></div>'
    +'  <button class="btn" type="submit">Voir ma chambre</button>'
    +'  <p class="msg" id="msg"></p>'
    +'</form></div>';
  document.getElementById('planBtn0').onclick=function(){ openZoom(null); };
  var input=document.getElementById('fName'), picker=document.getElementById('picker'), msg=document.getElementById('msg');
  function render(){
    var q=input.value, res=search(q);
    msg.textContent='';
    if(!norm(q)||!res.length){
      picker.hidden=true; picker.innerHTML='';
      if(norm(q).length>=2) msg.textContent='Aucun invité dormant sur place ne correspond à « '+q.trim()+' ». Vérifiez l’orthographe ou essayez votre nom de famille.';
      return;
    }
    picker.hidden=false;
    picker.innerHTML=(res.length>1?'<p>'+res.length+' personnes correspondent : touchez votre nom.</p>':'')
      +res.slice(0,12).map(function(i){return '<button type="button" class="pick" data-i="'+i+'"><span class="pn">'+nameHtml(PEOPLE[i])+'</span><span class="arrow">→</span></button>';}).join('')
      +(res.length>12?'<p>Continuez à taper pour affiner la liste…</p>':'');
  }
  input.addEventListener('input',render);
  picker.addEventListener('click',function(e){ var b=e.target.closest('.pick'); if(b) showResult(+b.dataset.i); });
  document.getElementById('lookup').addEventListener('submit',function(e){
    e.preventDefault();
    var res=search(input.value);
    if(!norm(input.value)){ msg.textContent='Tapez votre prénom.'; input.focus(); return; }
    if(res.length===1){ showResult(res[0]); return; }
    render();
    if(res.length>1) msg.textContent='Plusieurs personnes correspondent : touchez votre nom dans la liste.';
  });
  if(pre) render();
}

function showResult(i){
  var me=PEOPLE[i], room=ROOMS[me.c]||{};
  var mates=PEOPLE.filter(function(p,j){return j!==i && p.c===me.c;});
  var sameNights=mates.every(function(p){return p.x===me.x;});
  var chips='<div class="chips"><span class="chip">'+nuits(me.x)+'</span>'
    +'<span class="chip">'+(mates.length+1)+' personne'+(mates.length?'s':'')+' dans la chambre</span></div>';
  var matesHtml = mates.length
    ? '<ul class="mates">'+mates.map(function(p){
        return '<li><span class="pn">'+nameHtml(p)+'</span>'+(sameNights?'':'<span class="nn">'+nuits(p.x)+'</span>')+'</li>';
      }).join('')+'</ul>'
    : '<p class="alone">Vous avez la chambre pour vous seul·e.</p>';
  var pin = room.pt ? '<span class="pin" style="left:'+room.pt[0]+'%;top:'+room.pt[1]+'%"></span>' : '';
  var planNote = room.pt ? 'Touchez le plan pour l’agrandir.'
    : 'Cette chambre n’est pas repérée sur le plan : n’hésitez pas à nous demander le chemin.';
  document.getElementById('app').innerHTML=
     '<div class="card res">'
    +'  <div class="who">'+nameHtml(me)+'</div>'
    +'  <p class="welcome">Voici ta chambre pour le week-end 😉 Nous te souhaitons une bonne nuit… quand elle arrivera&nbsp;!</p>'
    +'  <div class="plate"><div class="k">Votre chambre</div><div class="v">'+esc(me.c)+'</div>'
    +     (room.note?'<div class="desc">'+room.note+'</div>':'')+chips+'</div>'
    +'  <div class="plate"><div class="k">'+(mates.length?'Vous la partagez avec':'Vos colocataires')+'</div>'+matesHtml+'</div>'
    +'  <div class="plate"><div class="k">Sur le plan du domaine</div>'
    +'    <button class="planbox" type="button" id="planBtn" aria-label="Agrandir le plan"><img src="'+PLAN+'" alt="Plan du domaine">'+pin+'</button>'
    +'    <div class="hint">'+planNote+'</div></div>'
    +'  <div class="again"><button class="btn ghost small" type="button" id="againBtn">← Nouvelle recherche</button></div>'
    +'</div>';
  document.getElementById('againBtn').onclick=function(){ showForm(''); window.scrollTo(0,0); };
  document.getElementById('planBtn').onclick=function(){ openZoom(room.pt); };
  try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){}
  try{ launchConfetti(); }catch(e){}
}

function openZoom(pt){
  var z=document.getElementById('zoom'), inner=document.getElementById('zoomInner');
  var old=inner.querySelector('.pin'); if(old) old.remove();
  if(pt){ var s=document.createElement('span'); s.className='pin'; s.style.left=pt[0]+'%'; s.style.top=pt[1]+'%'; inner.appendChild(s); }
  z.hidden=false; document.body.style.overflow='hidden';
  requestAnimationFrame(function(){
    if(pt){ z.scrollLeft=inner.offsetWidth*pt[0]/100-z.clientWidth/2; z.scrollTop=inner.offsetHeight*pt[1]/100-z.clientHeight/2; }
  });
}
document.getElementById('zoomClose').onclick=function(){ document.getElementById('zoom').hidden=true; document.body.style.overflow=''; };

function launchConfetti(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('.confetti-piece').forEach(function(e){e.remove();});
  var colors=['#E85946','#F2A3A3','#F7C5B8','#E85946','#F4847A'];
  var pieces=[];
  for(var i=0;i<200;i++){
    var el=document.createElement('div');
    el.className='confetti-piece';
    var w=4+Math.random()*5;
    el.style.width=w+'px'; el.style.height=w+'px';
    el.style.left=Math.random()*100+'vw';
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    el.style.borderRadius=Math.random()>0.5?'50%':'2px';
    document.body.appendChild(el);
    pieces.push({el:el,y:-20,vy:3+Math.random()*4,vx:(Math.random()-0.5)*2,rot:Math.random()*360,vrot:(Math.random()-0.5)*8,duration:2500+Math.random()*2000,delay:Math.random()*1500,start:null});
  }
  function step(ts){
    var alive=false;
    for(var k=0;k<pieces.length;k++){
      var p=pieces[k];
      if(!p.el.parentNode) continue;
      if(!p.start) p.start=ts;
      var el=ts-p.start-p.delay;
      if(el<0){ alive=true; continue; }
      var pr=el/p.duration;
      if(pr>=1){ p.el.remove(); continue; }
      alive=true;
      p.y+=p.vy; p.rot+=p.vrot;
      p.el.style.opacity=pr<0.1?pr/0.1:(pr>0.8?1-(pr-0.8)/0.2:1);
      p.el.style.transform='translate('+p.vx+'px, '+p.y+'px) rotate('+p.rot+'deg)';
    }
    if(alive) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
showForm('');
</script>
</body>
